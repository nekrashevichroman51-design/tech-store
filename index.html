<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEOTECH — техника будущего</title>

  <style>
    :root {
      --bg: #101116;
      --card: #191b22;
      --card-light: #242731;
      --text: #ffffff;
      --muted: #9ca1ae;
      --accent: #d8ff52;
      --border: rgba(255, 255, 255, 0.1);
      --danger: #ff6478;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--border);
      background: rgba(16, 17, 22, 0.94);
      backdrop-filter: blur(14px);
    }

    .header-inner {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      color: var(--accent);
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search {
      width: 280px;
      padding: 12px 15px;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
    }

    .search:focus {
      border-color: var(--accent);
    }

    .cart-button {
      position: relative;
      padding: 12px 16px;
      color: #111;
      background: var(--accent);
      border: 0;
      border-radius: 10px;
      font-weight: 800;
    }

    .cart-count {
      position: absolute;
      top: -8px;
      right: -8px;
      min-width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--danger);
      border-radius: 50%;
      font-size: 12px;
    }

    .hero {
      padding: 80px 0 55px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      align-items: center;
      gap: 40px;
    }

    .hero h1 {
      max-width: 700px;
      margin-bottom: 22px;
      font-size: clamp(44px, 7vw, 86px);
      line-height: 0.94;
      letter-spacing: -4px;
    }

    .hero h1 span {
      color: var(--accent);
    }

    .hero p {
      max-width: 560px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.6;
    }

    .hero-card {
      min-height: 280px;
      display: grid;
      place-items: center;
      padding: 30px;
      border: 1px solid var(--border);
      border-radius: 26px;
      background:
        radial-gradient(
          circle at 75% 20%,
          rgba(216, 255, 82, 0.55),
          transparent 25%
        ),
        linear-gradient(135deg, #37421d, #171922 70%);
    }

    .hero-card strong {
      color: var(--accent);
      font-size: clamp(36px, 5vw, 64px);
      line-height: 0.9;
      text-align: center;
      letter-spacing: -3px;
    }

    .catalog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    .catalog-header h2 {
      font-size: 32px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-button {
      padding: 10px 15px;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 999px;
    }

    .filter-button:hover,
    .filter-button.active {
      color: #111;
      background: var(--accent);
      border-color: var(--accent);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      padding-bottom: 80px;
    }

    .product-card {
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      transition: 0.2s ease;
    }

    .product-card:hover {
      border-color: rgba(216, 255, 82, 0.65);
      transform: translateY(-5px);
    }

    .product-image-wrapper {
      position: relative;
      aspect-ratio: 1 / 0.78;
      overflow: hidden;
      background: var(--card-light);
    }

    .product-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .product-category {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 7px 10px;
      color: #111;
      background: var(--accent);
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .product-info {
      padding: 18px;
    }

    .product-info h3 {
      margin-bottom: 8px;
      font-size: 20px;
    }

    .product-description {
      min-height: 40px;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    .product-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .product-price {
      color: var(--accent);
      font-size: 19px;
      white-space: nowrap;
    }

    .add-button {
      padding: 10px 14px;
      color: #111;
      background: var(--accent);
      border: 0;
      border-radius: 9px;
      font-weight: 800;
    }

    .add-button:hover {
      background: #f0ffaf;
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 60px 20px;
      color: var(--muted);
      text-align: center;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.72);
    }

    .modal.open {
      display: flex;
    }

    .modal-window {
      width: min(520px, 100%);
      max-height: 80vh;
      overflow-y: auto;
      padding: 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .close-button {
      color: var(--muted);
      background: transparent;
      border: 0;
      font-size: 28px;
    }

    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .cart-item-info {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .cart-item-price {
      color: var(--accent);
    }

    .remove-button {
      color: var(--danger);
      background: transparent;
      border: 0;
      font-size: 22px;
    }

    .cart-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-top: 22px;
    }

    .checkout-button {
      padding: 12px 16px;
      color: #111;
      background: var(--accent);
      border: 0;
      border-radius: 9px;
      font-weight: 800;
    }

    @media (max-width: 850px) {
      .hero-grid {
        grid-template-columns: 1fr;
      }

      .products-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 620px) {
      .header-inner {
        align-items: stretch;
        flex-direction: column;
        padding: 16px 0;
      }

      .header-actions {
        width: 100%;
      }

      .search {
        width: 100%;
      }

      .hero {
        padding-top: 48px;
      }

      .hero h1 {
        letter-spacing: -2px;
      }

      .catalog-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .products-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="container header-inner">
      <a class="logo" href="#">NEOTECH</a>

      <div class="header-actions">
        <input
          id="searchInput"
          class="search"
          type="search"
          placeholder="Поиск товаров..."
          autocomplete="off"
        >

        <button id="cartButton" class="cart-button" type="button">
          Корзина
          <span id="cartCount" class="cart-count">0</span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container hero-grid">
        <div>
          <h1>
            Техника для
            <span>нового</span>
            ритма жизни
          </h1>

          <p>
            Умные часы, производительные ноутбуки и смартфоны
            с современным дизайном.
          </p>
        </div>

        <div class="hero-card">
          <strong>TECH<br>FORWARD</strong>
        </div>
      </div>
    </section>

    <section class="container">
      <div class="catalog-header">
        <h2>Каталог</h2>

        <div class="filters">
          <button class="filter-button active" data-filter="all">
            Все
          </button>

          <button class="filter-button" data-filter="watch">
            Часы
          </button>

          <button class="filter-button" data-filter="laptop">
            Ноутбуки
          </button>

          <button class="filter-button" data-filter="phone">
            Смартфоны
          </button>
        </div>
      </div>

      <div id="productsGrid" class="products-grid"></div>
    </section>
  </main>

  <div id="cartModal" class="modal">
    <div class="modal-window">
      <div class="modal-header">
        <h2>Корзина</h2>

        <button
          id="closeCart"
          class="close-button"
          type="button"
          aria-label="Закрыть корзину"
        >
          ×
        </button>
      </div>

      <div id="cartItems"></div>

      <div class="cart-footer">
        <strong>
          Итого:
          <span id="cartTotal">0 ₽</span>
        </strong>

        <button class="checkout-button" type="button">
          Оформить
        </button>
      </div>
    </div>
  </div>

  <script>
    /*
      Используются локальные пути.
      Если файл отсутствует, будет показана SVG-заглушка.
    */
    const imageSets = {
      watch: [
        "assets/watch-1.jpg",
        "assets/watch-2.jpg",
        "assets/watch-3.jpg"
      ],

      laptop: [
        "assets/laptop-1.jpg",
        "assets/laptop-2.jpg",
        "assets/laptop-3.jpg"
      ],

      phone: [
        "assets/phone-1.jpg",
        "assets/phone-2.jpg",
        "assets/phone-3.jpg"
      ]
    };

    const categoryLabels = {
      watch: "Умные часы",
      laptop: "Ноутбук",
      phone: "Смартфон"
    };

    const products = [
      {
        id: 1,
        category: "watch",
        name: "Pulse Watch Pro",
        description: "AMOLED · GPS · До 14 дней работы",
        price: 24990,
        image: imageSets.watch[0]
      },
      {
        id: 2,
        category: "watch",
        name: "Active Watch",
        description: "Спорт · Пульс · Водозащита",
        price: 16990,
        image: imageSets.watch[1]
      },
      {
        id: 3,
        category: "watch",
        name: "Minimal Watch",
        description: "Лёгкий корпус · NFC · AMOLED",
        price: 19990,
        image: imageSets.watch[2]
      },
      {
        id: 4,
        category: "laptop",
        name: "NovaBook Air",
        description: "14″ · 16/512 GB · До 18 часов",
        price: 89990,
        image: imageSets.laptop[0]
      },
      {
        id: 5,
        category: "laptop",
        name: "WorkStation Pro",
        description: "16″ · 32/1000 GB · RTX Graphics",
        price: 149990,
        image: imageSets.laptop[1]
      },
      {
        id: 6,
        category: "laptop",
        name: "PixelBook X",
        description: "OLED · 32/1000 GB · Thunderbolt",
        price: 124990,
        image: "assets/laptop-pixelbook.jpg"
      },
      {
        id: 7,
        category: "phone",
        name: "NeoPhone Ultra",
        description: "6.7″ OLED · 512 GB · Pro Camera",
        price: 99990,
        image: imageSets.phone[0]
      },
      {
        id: 8,
        category: "phone",
        name: "NeoPhone Air",
        description: "6.1″ OLED · 256 GB · 5G",
        price: 69990,
        image: imageSets.phone[1]
      },
      {
        id: 9,
        category: "phone",
        name: "NeoPhone Mini",
        description: "5.8″ OLED · 128 GB · NFC",
        price: 49990,
        image: imageSets.phone[2]
      }
    ];

    let currentFilter = "all";
    let searchQuery = "";
    let cart = [];

    const productsGrid = document.getElementById("productsGrid");
    const searchInput = document.getElementById("searchInput");
    const cartButton = document.getElementById("cartButton");
    const cartCount = document.getElementById("cartCount");
    const cartModal = document.getElementById("cartModal");
    const closeCart = document.getElementById("closeCart");
    const cartItems = document.getElementById("cartItems");
    const cartTotal = document.getElementById("cartTotal");

    function formatPrice(price) {
      return new Intl.NumberFormat("ru-RU").format(price) + " ₽";
    }

    function createFallbackImage(product) {
      const themes = {
        watch: {
          first: "#d8ff52",
          second: "#252831",
          label: "SMART WATCH"
        },

        laptop: {
          first: "#75a7ff",
          second: "#171a23",
          label: "LAPTOP"
        },

        phone: {
          first: "#cb11ab",
          second: "#211827",
          label: "SMARTPHONE"
        }
      };

      const theme = themes[product.category];

      let device = "";

      if (product.category === "laptop") {
        device = `
          <rect
            x="210"
            y="170"
            width="480"
            height="290"
            rx="18"
            fill="#111318"
            stroke="#ffffff"
            stroke-opacity=".25"
            stroke-width="8"
          />

          <rect
            x="235"
            y="195"
            width="430"
            height="240"
            rx="8"
            fill="#30394c"
          />

          <path
            d="M130 500h640l55 55H75z"
            fill="#090a0d"
          />
        `;
      } else if (product.category === "watch") {
        device = `
          <rect
            x="350"
            y="55"
            width="200"
            height="580"
            rx="90"
            fill="#14161b"
          />

          <rect
            x="275"
            y="185"
            width="350"
            height="320"
            rx="75"
            fill="#08090c"
            stroke="#d8ff52"
            stroke-width="12"
          />

          <text
            x="450"
            y="375"
            text-anchor="middle"
            fill="#d8ff52"
            font-family="Arial"
            font-size="55"
            font-weight="700"
          >
            10:24
          </text>
        `;
      } else {
        device = `
          <rect
            x="310"
            y="65"
            width="280"
            height="570"
            rx="42"
            fill="#101116"
            stroke="#ffffff"
            stroke-opacity=".25"
            stroke-width="8"
          />

          <rect
            x="332"
            y="105"
            width="236"
            height="490"
            rx="28"
            fill="#332238"
          />

          <circle
            cx="450"
            cy="350"
            r="85"
            fill="#cb11ab"
            opacity=".65"
          />
        `;
      }

      const svg = `
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="900"
          height="700"
          viewBox="0 0 900 700"
        >
          <defs>
            <linearGradient
              id="bg"
              x1="0"
              y1="0"
              x2="1"
              y2="1"
            >
              <stop offset="0%" stop-color="${theme.first}"/>
              <stop offset="100%" stop-color="${theme.second}"/>
            </linearGradient>
          </defs>

          <rect width="900" height="700" fill="url(#bg)"/>

          <circle
            cx="760"
            cy="100"
            r="180"
            fill="#ffffff"
            opacity=".13"
          />

          <circle
            cx="100"
            cy="650"
            r="230"
            fill="#000000"
            opacity=".14"
          />

          ${device}

          <text
            x="450"
            y="640"
            text-anchor="middle"
            fill="#ffffff"
            font-family="Arial"
            font-size="25"
            font-weight="700"
            letter-spacing="4"
          >
            ${theme.label}
          </text>
        </svg>
      `;

      return "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(svg);
    }

    function createProductImage(product) {
      const image = document.createElement("img");

      image.className = "product-image";
      image.alt = product.name;
      image.loading = "eager";
      image.decoding = "async";

      let fallbackUsed = false;

      /*
        Обработчик устанавливается ДО image.src.
        Это важно: ошибка загрузки не будет пропущена.
      */
      image.addEventListener("error", () => {
        if (fallbackUsed) {
          return;
        }

        fallbackUsed = true;
        image.src = createFallbackImage(product);
      });

      image.src = product.image;

      return image;
    }

    function getVisibleProducts() {
      return products.filter((product) => {
        const matchesFilter =
          currentFilter === "all" ||
          product.category === currentFilter;

        const text = [
          product.name,
          product.description,
          categoryLabels[product.category]
        ]
          .join(" ")
          .toLowerCase();

        const matchesSearch = text.includes(searchQuery);

        return matchesFilter && matchesSearch;
      });
    }

    function renderProducts() {
      productsGrid.innerHTML = "";

      const visibleProducts = getVisibleProducts();

      if (visibleProducts.length === 0) {
        productsGrid.innerHTML = `
          <div class="empty-state">
            По вашему запросу ничего не найдено.
          </div>
        `;

        return;
      }

      visibleProducts.forEach((product) => {
        const card = document.createElement("article");
        card.className = "product-card";

        const imageWrapper = document.createElement("div");
        imageWrapper.className = "product-image-wrapper";

        const image = createProductImage(product);

        const category = document.createElement("span");
        category.className = "product-category";
        category.textContent = categoryLabels[product.category];

        imageWrapper.append(image, category);

        const info = document.createElement("div");
        info.className = "product-info";

        const title = document.createElement("h3");
        title.textContent = product.name;

        const description = document.createElement("p");
        description.className = "product-description";
        description.textContent = product.description;

        const bottom = document.createElement("div");
        bottom.className = "product-bottom";

        const price = document.createElement("strong");
        price.className = "product-price";
        price.textContent = formatPrice(product.price);

        const addButton = document.createElement("button");
        addButton.className = "add-button";
        addButton.type = "button";
        addButton.textContent = "В корзину";

        addButton.addEventListener("click", () => {
          cart.push(product);
          updateCart();
        });

        bottom.append(price, addButton);
        info.append(title, description, bottom);
        card.append(imageWrapper, info);
        productsGrid.appendChild(card);
      });
    }

    function updateCart() {
      cartCount.textContent = cart.length;
      cartItems.innerHTML = "";

      if (cart.length === 0) {
        cartItems.innerHTML = `
          <p style="color: var(--muted);">
            Корзина пока пуста.
          </p>
        `;

        cartTotal.textContent = "0 ₽";
        return;
      }

      let total = 0;

      cart.forEach((product, index) => {
        total += product.price;

        const item = document.createElement("div");
        item.className = "cart-item";

        const info = document.createElement("div");
        info.className = "cart-item-info";

        const name = document.createElement("strong");
        name.textContent = product.name;

        const price = document.createElement("span");
        price.className = "cart-item-price";
        price.textContent = formatPrice(product.price);

        const removeButton = document.createElement("button");
        removeButton.className = "remove-button";
        removeButton.type = "button";
        removeButton.textContent = "×";

        removeButton.addEventListener("click", () => {
          cart.splice(index, 1);
          updateCart();
        });

        info.append(name, price);
        item.append(info, removeButton);
        cartItems.appendChild(item);
      });

      cartTotal.textContent = formatPrice(total);
    }

    document.querySelectorAll(".filter-button").forEach((button) => {
      button.addEventListener("click", () => {
        document
          .querySelectorAll(".filter-button")
          .forEach((item) => item.classList.remove("active"));

        button.classList.add("active");
        currentFilter = button.dataset.filter;

        renderProducts();
      });
    });

    searchInput.addEventListener("input", (event) => {
      searchQuery = event.target.value.trim().toLowerCase();
      renderProducts();
    });

    cartButton.addEventListener("click", () => {
      cartModal.classList.add("open");
    });

    closeCart.addEventListener("click", () => {
      cartModal.classList.remove("open");
    });

    cartModal.addEventListener("click", (event) => {
      if (event.target === cartModal) {
        cartModal.classList.remove("open");
      }
    });

    renderProducts();
    updateCart();
  </script>
</body>
</html>
